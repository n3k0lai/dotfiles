# blade — Razer Blade Stealth 13" (Sharp eDP + Intel UHD 620)
# Do not use the kiss desk grid here: that parks eDP at 0x1440.

$laptopM = desc:Sharp Corporation 0x14B8

# Built-in Sharp 0x14B8 is 1080p60 only (EDID: 59.93 / 30). highrr picks 59.93.
# Fallback uses highrr so a USB-C/HDMI panel actually gets 144/165/240, not 60.
monitor = $laptopM, highrr, 0x0, 1
monitor = , highrr, auto, 1

workspace = 1, monitor:$laptopM, default:true
