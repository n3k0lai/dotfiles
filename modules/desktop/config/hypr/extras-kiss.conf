# kiss-only Hyprland extras. Hyprland 0.55 dropped misc:vfr,
# render:explicit_sync{,_kms}, and dwindle:pseudotile. Explicit sync is
# automatic when the DRM plane supports it. Software cursors stay on for
# the RTX 3070.

# Battle.net / WC3 / WoW window rules: ~/.config/hypr-host/bnet.conf
# (modules.gaming.bnet). Empty stub when that module is off.
source = ~/.config/hypr-host/bnet.conf

cursor {
    no_hardware_cursors = true
}

misc {
    vrr = 1
}

# Hyprland 0.55: windowrulev2 is a config error (the top banner).
windowrule = match:class ^xfreerdp$, workspace 3
windowrule = match:class ^xfreerdp$, match:title ^werk-fullscreen$, fullscreen on
windowrule = match:class ^xfreerdp$, match:title ^werk-tiled$, tile on
windowrule = match:class ^xfreerdp$, match:title ^werk-small$, tile on
windowrule = match:class ^xfreerdp$, border_size 0
windowrule = match:class ^xfreerdp$, rounding 0

windowrule = match:class ^com\.moonlight_stream\.Moonlight$, workspace 1
windowrule = match:class ^com\.moonlight_stream\.Moonlight$, fullscreen on
windowrule = match:class ^com\.moonlight_stream\.Moonlight$, border_size 0
windowrule = match:class ^com\.moonlight_stream\.Moonlight$, rounding 0

windowrule = match:class ^com\.chatterino\., match:float 1, stay_focused on

windowrule = match:class ^firefox$, no_blur on
windowrule = match:class ^firefox$, no_shadow on

windowrule = match:class ^mpv$, workspace 4
# The GUI reports a hard 320x568 max. Dwindle then refuses the tile and
# floats it again. no_max_size lifts that check; pseudo keeps the phone UI
# at 320x568 inside the cell instead of stretching it.
windowrule = match:class ^(Mullvad VPN)$, no_max_size on
windowrule = match:class ^(Mullvad VPN)$, tile on
windowrule = match:class ^(Mullvad VPN)$, pseudo on
windowrule = match:class ^(Mullvad VPN)$, size 320 568

windowrule = match:class pulsemixer, float on
windowrule = match:class bluetuith, float on
windowrule = match:class ^virt-viewer$, no_shortcuts_inhibit on
windowrule = match:class ^virt-manager$, no_shortcuts_inhibit on
