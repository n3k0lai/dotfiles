# kiss-only Hyprland extras. 0.55 on blade dropped vfr / explicit_sync /
# dwindle:pseudotile — do not put those in the shared hyprland.conf.
# RTX 3070: software cursors + explicit sync tunings for fullscreen freezes.

# Battle.net / WC3 / WoW window rules: ~/.config/hypr-host/bnet.conf
# (modules.gaming.bnet). Empty stub when that module is off.
source = ~/.config/hypr-host/bnet.conf

cursor {
    no_hardware_cursors = true
}

misc {
    vfr = false
    vrr = 1
}

render {
    explicit_sync = true
    explicit_sync_kms = true
}

dwindle {
    pseudotile = yes
}

# Window rules — kiss is Hyprland 0.49 (windowrulev2). Do not use
# match:class here; that syntax is 0.53+.
windowrulev2 = workspace 3, class:^(xfreerdp)$
windowrulev2 = fullscreen,  class:^(xfreerdp)$, title:^(werk-fullscreen)$
windowrulev2 = tile,        class:^(xfreerdp)$, title:^(werk-tiled)$
windowrulev2 = tile,        class:^(xfreerdp)$, title:^(werk-small)$
windowrulev2 = noborder,    class:^(xfreerdp)$
windowrulev2 = rounding 0,  class:^(xfreerdp)$

windowrulev2 = workspace 1, class:^(com\.moonlight_stream\.Moonlight)$
windowrulev2 = fullscreen,  class:^(com\.moonlight_stream\.Moonlight)$
windowrulev2 = noborder,    class:^(com\.moonlight_stream\.Moonlight)$
windowrulev2 = rounding 0,  class:^(com\.moonlight_stream\.Moonlight)$

windowrulev2 = stayfocused, class:^(com\.chatterino\.)$, floating:1

windowrulev2 = noblur, class:^(firefox)$
windowrulev2 = noshadow, class:^(firefox)$

windowrulev2 = workspace 4, class:^(mpv)$
# The GUI reports a hard 320x568 max. Dwindle then refuses the tile and
# floats it again. nomaxsize lifts that check; pseudo keeps the phone UI
# at 320x568 inside the cell instead of stretching it.
windowrulev2 = nomaxsize, class:^(Mullvad VPN)$
windowrulev2 = tile, class:^(Mullvad VPN)$
windowrulev2 = pseudo, class:^(Mullvad VPN)$
windowrulev2 = size 320 568, class:^(Mullvad VPN)$

windowrulev2 = float, class:pulsemixer
windowrulev2 = float, class:bluetuith
# 0.49 token is noshortcutsinhibit (no_shortcuts_inhibit is 0.53+ / blade).
windowrulev2 = noshortcutsinhibit, class:^(virt-viewer)$
windowrulev2 = noshortcutsinhibit, class:^(virt-manager)$
