#   ;3
# my hypr conf
#

# NVIDIA GBM/GLX/VAAPI come from modules.desktop.hyprland.nvidia (Nix
# sessionVariables). Do not set them here — blade is Intel-primary.
env = XDG_SESSION_TYPE,wayland

# Host extras (NVIDIA cursor/vfr on kiss; empty on blade).
source = ~/.config/hypr-host/extras.conf

misc {
    vrr = 1
}

# fcitx5: unset legacy IM vars on Wayland (set by i18n.inputMethod module)
# fcitx5 uses the native Wayland input method protocol instead
env = GTK_IM_MODULE,
env = QT_IM_MODULE,

# Host monitor / workspace grid (kiss desk vs blade eDP)
source = ~/.config/hypr-host/monitors.conf
# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
exec-once = fcitx5 -d --replace
# Use mpvpaper for video wallpapers (hyprpaper conflicts with mpvpaper)
exec-once = bash ~/.config/hypr/set-wallpaper.sh

# Idle / DPMS management (powers down monitors "eventually" after lock for bedtime use-case).
# audio-idle-inhibit.sh starts sway-audio-idle-inhibit while unlocked so hypridle
# won't DPMS-off during media; hypridle stops it on lock for the bedtime flow.
exec-once = hypridle
exec-once = bash ~/.config/hypr/audio-idle-inhibit.sh start

# Eww sidebar — use manager script with retries so a late monitor does not
# leave the daemon running with no window open.
exec-once = ~/.config/eww/eww-sidebar start

# Source a file (multi-file configs)
#source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11

# Propagate Wayland/X11 env to dbus and systemd user session
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XAUTHORITY
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY XAUTHORITY PATH
# greetd+Hyprland does not reach graphical-session.target by itself, so
# nm-applet / gnome-keyring (WiFi PSKs) never start. Start them here.
exec-once = systemctl --user start graphical-session.target
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = nm-applet --indicator

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        tap-to-click = yes
        disable_while_typing = yes
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

binds {
    pass_mouse_when_bound = false
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(4ba69cee) rgba(9da09eee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    #blur = yes
    #blur_size = 3
    #blur_passes = 1
    #blur_new_optimizations = on
    blur {
      enabled = true
      size = 3
      passes = 1
      new_optimizations = true
    }
    #drop_shadow = yes
    #shadow_range = 4
    #shadow_render_power = 3
    shadow {
      enabled = true
      range = 4
      render_power = 3
      color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    preserve_split = yes
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}

#gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
#    workspace_swipe = off
#}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic-mouse-v1 {
#    sensitivity = -0.5
#}

# Window rules live in ~/.config/hypr-host/extras.conf
# (0.55 match: syntax on blade, windowrulev2 on kiss 25.05).

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bindl = $mainMod, Return, exec, kitty
bindl = $mainMod, Q, killactive, 
bindl = CTRL ALT, Backspace, exit, 
#bind = $mainMod, E, exec, dolphin
# Simple reliable lock (black screen)
bindl = $mainMod SHIFT, E, exec, hyprlock
bindl = $mainMod, V, togglefloating, 
bindl = $mainMod, F, fullscreen, 
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod, N, exec, kitty -e nmtui
bindl = $mainMod, B, exec, ~/.config/eww/eww-sidebar toggle
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bindl = $mainMod, P, exec, grim -g "$(slurp -d)" - | wl-copy
bindl = $mainMod ALT, P, exec, hyprpicker -f hex -a

# Laptop backlight (no-op on a desktop with no backlight device)
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Input method
bindl = $mainMod, I, exec, fcitx5-remote -t
bindl = $mainMod, period, exec, wtype -M ctrl -M alt -M shift -k u

# Move focus with mainMod + h,j,k,l
bindl = $mainMod, H, movefocus, l
bindl = $mainMod, J, movefocus, d
bindl = $mainMod, K, movefocus, u
bindl = $mainMod, L, movefocus, r

# Move focus with mainMod + arrow keys
bindl = $mainMod, left,  movefocus, l
bindl = $mainMod, right, movefocus, r
bindl = $mainMod, up,    movefocus, u
bindl = $mainMod, down,  movefocus, d

# resize active window with mainMod + ALT + h,j,k,l
bindl = $mainMod ALT, H, resizeactive, -10 0
bindl = $mainMod ALT, J, resizeactive,  0 10
bindl = $mainMod ALT, K, resizeactive,  0 -10
bindl = $mainMod ALT, L, resizeactive,  10 0

# resize active window with mainMod + ALT + direction
bindl = $mainMod ALT, left,  resizeactive, -10 0
bindl = $mainMod ALT, down,  resizeactive,  0 10
bindl = $mainMod ALT, up,    resizeactive,  0 -10
bindl = $mainMod ALT, right, resizeactive,  10 0

# swap window with mainMod + SHIFT + h,j,k,l
bindl = $mainMod SHIFT, H, swapwindow, l
bindl = $mainMod SHIFT, J, swapwindow, d
bindl = $mainMod SHIFT, K, swapwindow, u
bindl = $mainMod SHIFT, L, swapwindow, r

# swap window with mainMod + SHIFT + direction
bindl = $mainMod SHIFT, left,  swapwindow, l
bindl = $mainMod SHIFT, down,  swapwindow, d
bindl = $mainMod SHIFT, up,    swapwindow, u
bindl = $mainMod SHIFT, right, swapwindow, r

# Switch workspaces with mainMod + [0-9]
bindl = $mainMod, 1, workspace, 1
bindl = $mainMod, 2, workspace, 2
bindl = $mainMod, 3, workspace, 3
bindl = $mainMod, 4, workspace, 4
bindl = $mainMod, 5, workspace, 5
bindl = $mainMod, 6, workspace, 6
bindl = $mainMod, 7, workspace, 7
bindl = $mainMod, 8, workspace, 8
bindl = $mainMod, 9, workspace, 9
bindl = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindl = $mainMod SHIFT, 1, movetoworkspace, 1
bindl = $mainMod SHIFT, 2, movetoworkspace, 2
bindl = $mainMod SHIFT, 3, movetoworkspace, 3
bindl = $mainMod SHIFT, 4, movetoworkspace, 4
bindl = $mainMod SHIFT, 5, movetoworkspace, 5
bindl = $mainMod SHIFT, 6, movetoworkspace, 6
bindl = $mainMod SHIFT, 7, movetoworkspace, 7
bindl = $mainMod SHIFT, 8, movetoworkspace, 8
bindl = $mainMod SHIFT, 9, movetoworkspace, 9
bindl = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
